<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Note Taking App</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f0f8ff;
            padding: 40px;
        }

        .container{
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1{
            text-align: center;
            color: darkblue;
        }

        input{
            width: 80%;
            padding: 10px;
        }

        button{
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li{
            margin-top: 10px;
            background: lightyellow;
            padding: 8px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📝 Note Taking Application</h1>

        <form method="POST">

            <input type="text"
                   name="note"
                   placeholder="Enter a note"
                   required>

            <button type="submit">
                Add Note
            </button>

        </form>

        <h2>Saved Notes</h2>

        <ul>

            {% for note in notes %}

                <li>{{ note }}</li>

            {% endfor %}

        </ul>

    </div>

</body>
</html>
