<!DOCTYPE html>
<html>
<head>
    <title>Regex Matcher App</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f0f8ff;
            padding: 40px;
        }

        h1{
            color: darkblue;
            text-align: center;
        }

        form{
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }

        textarea, input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button{
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .results{
            background: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
        }

        .match{
            background: lightgreen;
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
        }

        .error{
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>Regex101 Mini Clone 🔍</h1>

    <form method="POST">

        <label><b>Enter Test String:</b></label>

        <textarea name="test_string" rows="6" placeholder="Enter text here...">{{ test_string if test_string else '' }}</textarea>

        <label><b>Enter Regex Pattern:</b></label>

        <input type="text" name="regex_pattern"
               placeholder="Example: \d+"
               value="{{ regex_pattern if regex_pattern else '' }}">

        <button type="submit">Find Matches</button>

    </form>

    {% if matches %}

    <div class="results">

        <h2>Matched Results ✅</h2>

        {% for match in matches %}

            <div class="match">
                {{ match }}
            </div>

        {% endfor %}

    </div>

    {% endif %}

    {% if error %}

    <div class="results">
        <p class="error">{{ error }}</p>
    </div>

    {% endif %}

</body>
</html>
