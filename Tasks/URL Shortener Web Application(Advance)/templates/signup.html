<!DOCTYPE html>
<html>
<head>

    <title>Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card p-4 shadow">

        <h1>Signup</h1>

        <form method="POST">

            <input type="text"
                   name="username"
                   class="form-control mb-3"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   class="form-control mb-3"
                   placeholder="Enter Password"
                   required>

            <button class="btn btn-primary w-100">
                Signup
            </button>

        </form>

        {% if error %}

        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>

        {% endif %}

        <a href="/login" class="btn btn-dark mt-3">
            Login
        </a>

    </div>

</div>

</body>
</html>
